name: Deploy StayFinder


on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL:  "postgresql://postgres.avnbpkbqzsxpspnbhejx:wcRmeT1LnPyZH1ed85TgBCCU97Q88GbldPlGApugUMnkh5VEUdBu3JTMGv8SeCS4@aws-0-us-west-2.pooler.supabase.com:5432/postgres"


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migration
        run: npx prisma migrate deploy

      - name: Build Next.js App
        run: npm run build
