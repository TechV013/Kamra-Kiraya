name: Deploy Kamra Kiraya

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Push Database Schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js App
        run: npm run build
        env:
          DATABASE_URL: ${{***REMOVED***
}}
          JWT_SECRET: ${{ ***REMOVED*** }}
          UPI_ID: ${{ 8209184926@axl }}
          UPI_NAME: ${{ Kamra Kiraya }}
          UPI_NOTE: ${{ secrets.UPI_NOTE }}
          NEXT_PUBLIC_UPI_ID: ${{ secrets.NEXT_PUBLIC_UPI_ID }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          GEMINI_API_KEY: ${{ AQ.Ab8RN6JdYBe_M0nRFJG6QJzVhg1AzB5BOh6pGnw4_JyDpXgc6A }}
