services:
  - type: web
    name: kamra-kiraya
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npx next start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: UPI_ID
        value: "8209184926@axl"
      - key: UPI_NAME
        value: "Kamra Kiraya"
      - key: UPI_NOTE
        value: "Kamra Kiraya room booking payment"
      - key: NEXT_PUBLIC_UPI_ID
        value: "8209184926@axl"
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: SUPABASE_URL
        value: "https://wmfibigtcaxtedfhehcx.supabase.co"
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: "https://kamra-kiraya.vercel.app"
