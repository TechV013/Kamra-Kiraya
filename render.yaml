services:
  - type: web
    name: kamra-kiraya
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npx next start
    envVars:
      - key: DATABASE_URL
        value: "***REMOVED***"
      - key: DIRECT_URL
        value: "***REMOVED***"
      - key: JWT_SECRET
        value: "***REMOVED***"
      - key: UPI_ID
        value: "8209184926@axl"
      - key: UPI_NAME
        value: "Kamra Kiraya"
      - key: UPI_NOTE
        value: "Kamra Kiraya room booking payment"
      - key: NEXT_PUBLIC_UPI_ID
        value: "8209184926@axl"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
